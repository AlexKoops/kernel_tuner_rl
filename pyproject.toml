[project]
name = "kernel-tuner-rl"
version = "0.1.0"
description = "Reinforcement learning for GPU kernel parameter tuning"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "gymnasium",
    "sb3-contrib",
    "stable_baselines3",
    "matplotlib",
    "questionary",
    "kernel-tuner>=1.1.3",
    "autotuning-methodology>=1.0.0",
    "rich>=15.0.0",
    "tqdm>=4.67.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kernel_tuner_rl*"]

[tool.black]
line-length = 150
